# Полный контур: PostgreSQL + Qdrant-сервер + Ollama + приложение.
# Нужен, когда данных много или демо должно пережить перезапуск на стенде:
#
#   docker compose -f docker-compose.full.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?задайте APP_SECRET_KEY в файле .env}
      APP_DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      APP_QDRANT_URL: http://qdrant:6333
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-http://ollama:11434}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen2.5:7b-instruct}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_DATA_DIR: /data
    volumes:
      - appdata:/data
      - models:/models
    ports:
      - "${APP_PORT:-80}:8000"

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
  appdata:
  models:

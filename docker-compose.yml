# Демо-контур: приложение + Ollama. База — SQLite, вектора — встроенный Qdrant,
# всё лежит в ./data. Запуск:
#
#   cp .env.example .env && docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
#
# Интерфейс: http://<адрес>/ — вход демо-пользователем из backend/app/seed.py.

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?задайте APP_SECRET_KEY в файле .env}
      APP_TITLE: ${APP_TITLE:-ИИ-помощник}
      APP_SUBTITLE: ${APP_SUBTITLE:-демонстрационный контур}
      APP_DATA_DIR: /data
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-http://ollama:11434}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen2.5:7b-instruct}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-demo2026}
      APP_BASELINE_MANUAL_MINUTES: ${APP_BASELINE_MANUAL_MINUTES:-120}
    volumes:
      - ./data:/data
      - models:/models
    ports:
      - "${APP_PORT:-80}:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    # раскомментируйте, чтобы дёргать модель снаружи контура:
    # ports: ["11434:11434"]

volumes:
  ollamadata:
  models:

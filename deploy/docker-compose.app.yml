# Только приложение, без локальной Ollama: модель в облаке или на другом сервере,
# Keycloak на отдельном сервере. Запуск в корне проекта:
#   docker compose -f deploy/docker-compose.app.yml up -d --build
services:
  api:
    build:
      context: ..
    restart: unless-stopped
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?задайте APP_SECRET_KEY в .env}
      APP_TITLE: ${APP_TITLE:-Цифровой аналитик экзит-интервью}
      APP_SUBTITLE: ${APP_SUBTITLE:-}
      APP_DATA_DIR: /data
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://ollama.com}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-gpt-oss:20b}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODELS: ${APP_LLM_MODELS:-}
      APP_LLM_TIMEOUT: ${APP_LLM_TIMEOUT:-180}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-demo2026}
      APP_BASELINE_MANUAL_MINUTES: ${APP_BASELINE_MANUAL_MINUTES:-40}
      APP_OIDC_ENABLED: ${APP_OIDC_ENABLED:-false}
      APP_LOCAL_LOGIN_ENABLED: ${APP_LOCAL_LOGIN_ENABLED:-true}
      APP_OIDC_ISSUER: ${APP_OIDC_ISSUER:-}
      APP_OIDC_CLIENT_ID: ${APP_OIDC_CLIENT_ID:-app}
      APP_OIDC_REDIRECT_URL: ${APP_OIDC_REDIRECT_URL:-http://localhost/api/auth/oidc/callback}
      APP_OIDC_POST_LOGOUT_URL: ${APP_OIDC_POST_LOGOUT_URL:-http://localhost/login}
    volumes:
      - ../data:/data
      - ../prompts:/prompts        # промпты правятся на сервере без пересборки
    ports:
      - "${APP_PORT:-80}:8000"
